<!DOCTYPE html>
<html><head><title>Chat</title>
<style>
body{font-family:Arial;background:#111;color:white;margin:0}
.top{background:#222;padding:15px;display:flex;justify-content:space-between}
#chat{height:70vh;overflow-y:auto;padding:15px}
.user{background:#25D366;color:black;padding:10px;border-radius:10px;margin:5px 0 5px 50px;text-align:right}
.ai{background:#333;padding:10px;border-radius:10px;margin:5px 50px 5px 0}
.bottom{display:flex;padding:10px}
input{flex:1;padding:12px;border-radius:10px;border:none}
button{padding:12px 20px;background:#25D366;border:none;border-radius:10px;margin-left:5px;cursor:pointer}
a{color:white;text-decoration:none}
</style></head>
<body>
<div class="top"><b>🤖 Mera AI Chatbot</b><a href="/logout">Logout 🚪</a></div>
<div id="chat"></div>
<div class="bottom">
<input id="msg" placeholder="Kuch pucho...">
<button onclick="send()">Send</button>
</div>
<script>
async function load(){
  let r = await fetch("/history"); let d = await r.json();
  d.history.forEach(([role, text]) => add(role, text));
}
function add(role, text){
  let div = document.createElement("div");
  div.className = role == "user" ? "user" : "ai";
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}
async function send(){
  let inp = document.getElementById("msg");
  if(!inp.value) return;
  let m = inp.value; inp.value = ""; add("user", m);
  let r = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message:m})});
  let d = await r.json(); add("ai", d.reply);
}
load();
</script></body></html>
